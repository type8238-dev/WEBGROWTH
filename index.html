<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WEBGROWTH — Прайс-лист</title>
    <style>
        :root {
            --bg-light: #e8f0fe;
            --bg-dark: #0f1a2e;
            --card-light: rgba(255, 255, 255, 0.75);
            --card-dark: rgba(20, 35, 60, 0.8);
            --accent-1: #1e90ff;
            --accent-2: #00b4d8;
            --accent-3: #0077b6;
            --text-light: #1a2a3a;
            --text-dark: #e8f0fe;
            --border-light: rgba(255, 255, 255, 0.4);
            --border-dark: rgba(30, 144, 255, 0.3);
            --shadow-light: 0 8px 32px rgba(0, 119, 182, 0.2);
            --shadow-dark: 0 8px 32px rgba(0, 0, 0, 0.4);
            --glow: 0 0 40px rgba(30, 144, 255, 0.5);
            --red: #ff4d4f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            overflow: hidden;
            position: relative;
            background: linear-gradient(135deg, #0f1a2e 0%, #0a2540 25%, #0d3b66 50%, #1a5276 75%, #0a2a3a 100%);
            transition: background 0.5s;
        }

        @media (prefers-color-scheme: light) {
            body {
                background: linear-gradient(135deg, #e8f0fe 0%, #d4e4f7 25%, #b8d4f0 50%, #a8ccf0 75%, #c2ddf5 100%);
            }
        }

        .bg-orb {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(60px);
            opacity: 0.55;
            animation: floatOrb 12s ease-in-out infinite;
            z-index: 0;
        }
        .orb-1 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #1e90ff, #0077b6);
            top: -50px;
            left: -50px;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #00b4d8, #0096c7);
            bottom: -100px;
            right: -100px;
            animation-delay: -4s;
        }
        .orb-3 {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, #48cae4, #00b4d8);
            top: 40%;
            left: 60%;
            animation-delay: -8s;
        }

        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -30px) scale(1.1); }
            50% { transform: translate(-20px, 20px) scale(0.9); }
            75% { transform: translate(15px, 15px) scale(1.05); }
        }

        .particle {
            position: fixed;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            pointer-events: none;
            animation: floatParticle 8s linear infinite;
            z-index: 0;
        }
        .particle::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200%;
            height: 200%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(30, 144, 255, 0.3), transparent);
        }
        @keyframes floatParticle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            20% { opacity: 0.8; }
            50% { transform: translateY(40vh) scale(1.2); }
            80% { opacity: 0.8; }
            100% { transform: translateY(-20vh) scale(0.5); opacity: 0; }
        }

        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
            pointer-events: none;
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(40px, 40px); }
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 32px 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        @media (prefers-color-scheme: light) {
            .container {
                background: rgba(255, 255, 255, 0.55);
                border: 1px solid rgba(255, 255, 255, 0.7);
                box-shadow: 0 25px 60px rgba(0, 100, 200, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.8);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 8px;
        }
        .logo-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #1e90ff, #00b4d8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 6px;
            position: relative;
        }
        .logo-badge::before {
            content: '⚡';
            -webkit-text-fill-color: initial;
            font-size: 28px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #a8d8ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        @media (prefers-color-scheme: light) {
            .header h1 {
                background: linear-gradient(135deg, #0d3b66 0%, #1e90ff 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }
        }
        .header .subtitle {
            font-size: 15px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 6px;
            letter-spacing: 0.3px;
        }
        @media (prefers-color-scheme: light) {
            .header .subtitle {
                color: rgba(13, 59, 102, 0.7);
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 18px;
            padding: 20px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        @media (prefers-color-scheme: light) {
            .card {
                background: rgba(255, 255, 255, 0.65);
                border: 1px solid rgba(255, 255, 255, 0.9);
            }
        }
        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(30, 144, 255, 0.1) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .card:hover::before {
            opacity: 1;
        }
        .card:hover {
            border-color: rgba(30, 144, 255, 0.5);
            box-shadow: 0 8px 25px rgba(30, 144, 255, 0.25);
            transform: translateY(-2px);
        }

        .card-icon {
            font-size: 36px;
            margin-right: 16px;
            flex-shrink: 0;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
        }
        .card-info {
            flex: 1;
        }
        .card-title {
            font-size: 19px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.3px;
        }
        @media (prefers-color-scheme: light) {
            .card-title {
                color: #0d2b4e;
            }
        }
        .card-desc {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 3px;
        }
        @media (prefers-color-scheme: light) {
            .card-desc {
                color: rgba(13, 43, 78, 0.6);
            }
        }
        .card-price {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #90d5ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: right;
            flex-shrink: 0;
            margin-left: 12px;
            letter-spacing: -0.5px;
        }
        @media (prefers-color-scheme: light) {
            .card-price {
                background: linear-gradient(135deg, #0077b6, #00b4d8);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }
        }

        .telegram-btn {
            width: 100%;
            background: linear-gradient(135deg, #1e90ff 0%, #00b4d8 50%, #0077b6 100%);
            color: white;
            border: none;
            border-radius: 18px;
            padding: 18px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.3px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(30, 144, 255, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .telegram-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.4s;
        }
        .telegram-btn:hover::after {
            opacity: 1;
        }
        .telegram-btn:active {
            transform: scale(0.97);
            box-shadow: 0 5px 15px rgba(30, 144, 255, 0.4);
        }
        .telegram-btn svg {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }

        .footer {
            text-align: center;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.2px;
        }
        @media (prefers-color-scheme: light) {
            .footer {
                color: rgba(13, 43, 78, 0.5);
            }
        }
        .footer a {
            color: #90d5ff;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }
        @media (prefers-color-scheme: light) {
            .footer a {
                color: #0077b6;
            }
        }
        .footer a:hover {
            color: #1e90ff;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #1e90ff, #00b4d8, transparent);
            margin: 0 auto;
            border-radius: 2px;
        }

        /* Новый блок предупреждения */
        .warning {
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: var(--red);
            margin-top: 4px;
            letter-spacing: 0.2px;
            text-shadow: 0 0 8px rgba(255, 77, 79, 0.3);
        }
        .warning .no-domain {
            font-weight: 800;
            text-decoration: underline;
            text-decoration-color: var(--red);
        }
    </style>
</head>
<body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>
    <div class="grid-overlay"></div>
    <div id="particles"></div>

    <div class="container">
        <div class="header">
            <div class="logo-badge">WEBGROWTH</div>
            <p class="subtitle">Прайс-лист на услуги разработки</p>
        </div>
        
        <div class="divider"></div>

        <div class="card">
            <div class="card-icon">🚀</div>
            <div class="card-info">
                <div class="card-title">Лендинг</div>
                <div class="card-desc">Одностраничный сайт</div>
            </div>
            <div class="card-price">500 ₽</div>
        </div>

        <div class="card">
            <div class="card-icon">💼</div>
            <div class="card-info">
                <div class="card-title">Сайт-визитка</div>
                <div class="card-desc">Небольшой сайт с контактами</div>
            </div>
            <div class="card-price">500 ₽</div>
        </div>

        <div class="card">
            <div class="card-icon">🤖</div>
            <div class="card-info">
                <div class="card-title">Бот</div>
                <div class="card-desc">Telegram-бот</div>
            </div>
            <div class="card-price">1000 ₽</div>
        </div>

        <button class="telegram-btn" id="openChannel">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
            </svg>
            Открыть Telegram-канал
        </button>

        <div class="warning">
            Выдаю готовый код с инструкцией <span class="no-domain">(без домена!!!)</span>
        </div>

        <div class="footer">
            Наш канал: <a href="https://t.me/WEBGROWTH8773" target="_blank">@WEBGROWTH8773</a>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function createParticles() {
            const container = document.getElementById('particles');
            const count = 25;
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                const size = Math.random() * 6 + 2;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 10 + 's';
                particle.style.animationDuration = Math.random() * 6 + 6 + 's';
                particle.style.opacity = Math.random() * 0.5 + 0.2;
                container.appendChild(particle);
            }
        }
        createParticles();

        document.getElementById('openChannel').addEventListener('click', () => {
            tg.openTelegramLink('https://t.me/WEBGROWTH8773');
        });
    </script>
</body>
</html>
